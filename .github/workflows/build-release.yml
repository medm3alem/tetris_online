name: Build & Release

# Déclenché sur chaque tag vX.Y.Z (ex: git tag v1.1.0 && git push --tags)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  #  LINUX CLIENT
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake build-essential \
            libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            libasound2-dev libpulse-dev

      - name: Installer Raylib 5
        run: |
          wget -q https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_linux_amd64.tar.gz
          tar -xf raylib-5.0_linux_amd64.tar.gz
          sudo cp -r raylib-5.0_linux_amd64/include/* /usr/local/include/
          sudo cp -r raylib-5.0_linux_amd64/lib/*     /usr/local/lib/
          sudo ldconfig

      - name: Compiler
        working-directory: client
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON
          cmake --build build --config Release -j$(nproc)

      - name: Créer le package
        working-directory: client
        run: |
          mkdir -p package/TetrisOnline-linux
          cp build/tetris package/TetrisOnline-linux/
          cp -r sounds    package/TetrisOnline-linux/
          cd package
          tar -czf TetrisOnline-linux-x64.tar.gz TetrisOnline-linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrisOnline-linux-x64
          path: client/package/TetrisOnline-linux-x64.tar.gz

  # ─────────────────────────────────────────────────────────────
  #  SERVEUR (binaire Linux statique)
  # ─────────────────────────────────────────────────────────────
  build-server:
    name: Serveur Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential

      - name: Compiler
        working-directory: server
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++ -pthread"
          cmake --build build --config Release -j$(nproc)

       - name: Créer le package
        working-directory: server
        run: |
          mkdir -p package
          cp build/tetris_server package/
          echo "Tetris Online - Serveur" > package/README.txt
          echo "Lancement : ./tetris_server" >> package/README.txt
          echo "Port : 4242 (TCP)" >> package/README.txt
          echo "Ping/pong toutes les 10s, timeout 30s, max 100 clients" >> package/README.txt
          cd package
          tar -czf TetrisOnline-server-linux-x64.tar.gz tetris_server README.txt

Lancement :
  ./tetris_server

Le serveur écoute sur le port 4242 (TCP).
Assurez-vous que le port est ouvert dans votre pare-feu.

Comportement :
  - Rooms 1v1, matchmaking automatique
  - Heartbeat PING/PONG toutes les 10s
  - Timeout client après 30s sans réponse
  - Maximum 100 clients simultanés
EOF
          cd package
          tar -czf TetrisOnline-server-linux-x64.tar.gz tetris_server README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrisOnline-server-linux-x64
          path: server/package/TetrisOnline-server-linux-x64.tar.gz

  # ─────────────────────────────────────────────────────────────
  #  WINDOWS CLIENT
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (natif MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Raylib
        run: |
          $url = "https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_win64_msvc16.zip"
          Invoke-WebRequest $url -OutFile raylib.zip
          Expand-Archive raylib.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path deps/raylib-win
          Copy-Item -Recurse raylib-5.0_win64_msvc16/include deps/raylib-win/
          Copy-Item -Recurse raylib-5.0_win64_msvc16/lib     deps/raylib-win/
        shell: pwsh

      - name: Compiler
        working-directory: client
        run: |
          cmake -B build-win -DCMAKE_BUILD_TYPE=Release -DTOOLCHAIN_WINDOWS=ON -DRAYLIB_WIN_DIR=../deps/raylib-win
          cmake --build build-win --config Release
        shell: cmd

      - name: Créer le package
        working-directory: client
        run: |
          New-Item -ItemType Directory -Force -Path package/TetrisOnline-windows
          Copy-Item build-win/Release/tetris.exe package/TetrisOnline-windows/
          Copy-Item -Recurse sounds package/TetrisOnline-windows/
          Compress-Archive package/TetrisOnline-windows TetrisOnline-windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrisOnline-windows-x64
          path: client/TetrisOnline-windows-x64.zip

  # ─────────────────────────────────────────────────────────────
  #  MACOS CLIENT
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (universal)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Raylib via Homebrew
        run: brew install raylib

      - name: Compiler
        working-directory: client
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations"
          cmake --build build --config Release -j$(sysctl -n hw.logicalcpu)

      - name: Créer le package
        working-directory: client
        run: |
          mkdir -p package/TetrisOnline-macos
          if [ -f build/tetris ]; then
            cp build/tetris package/TetrisOnline-macos/
          else
            cp build/tetris.app/Contents/MacOS/tetris package/TetrisOnline-macos/
          fi
          cp -r sounds package/TetrisOnline-macos/
          cd package
          zip -r TetrisOnline-macos-arm64.zip TetrisOnline-macos/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrisOnline-macos-arm64
          path: client/package/TetrisOnline-macos-arm64.zip

  # ─────────────────────────────────────────────────────────────
  #  RELEASE GITHUB — 4 fichiers : 3 clients + 1 serveur
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publier la release GitHub
    needs: [build-linux, build-windows, build-macos, build-server]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tetris Online ${{ github.ref_name }}"
          body: |
            ## Tetris Online ${{ github.ref_name }}

            ### Téléchargements — Client
            | Plateforme | Fichier |
            |------------|---------|
            | 🐧 Linux   | `TetrisOnline-linux-x64.tar.gz` |
            | 🪟 Windows | `TetrisOnline-windows-x64.zip`  |
            | 🍎 macOS   | `TetrisOnline-macos-arm64.zip`  |

            ### Téléchargements — Serveur
            | Plateforme | Fichier |
            |------------|---------|
            | 🐧 Linux   | `TetrisOnline-server-linux-x64.tar.gz` |

            ---

            ### Installation client
            **Linux** : extraire → `chmod +x tetris` → `./tetris`
            **Windows** : extraire → double-cliquer `tetris.exe`
            **macOS** : extraire → `./tetris` (ou clic droit → Ouvrir)

            ### Héberger le serveur
            ```bash
            tar -xzf TetrisOnline-server-linux-x64.tar.gz
            ./tetris_server
            # Écoute sur le port 4242
            ```

            ### Se connecter à un serveur custom
            ```bash
            ./tetris <ip_ou_hostname>
            # Exemple : ./tetris tetris-online.ddns.net
            ```

            ### Nouveautés ${{ github.ref_name }}
            - TCP_NODELAY activé — latence réduite
            - Heartbeat PING/PONG — détection des déconnexions en 30s
            - Limite 100 clients simultanés
            - Gestion `SERVER_FULL` côté client
            - Logs structurés côté serveur `[HH:MM:SS] [INFO/WARN/ERROR]`
          files: |
            artifacts/TetrisOnline-linux-x64/TetrisOnline-linux-x64.tar.gz
            artifacts/TetrisOnline-windows-x64/TetrisOnline-windows-x64.zip
            artifacts/TetrisOnline-macos-arm64/TetrisOnline-macos-arm64.zip
            artifacts/TetrisOnline-server-linux-x64/TetrisOnline-server-linux-x64.tar.gz
          draft: false
          prerelease: false
